<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>检测接口测试</title>
</head>
<body>
    <h1>YOLO 检测接口测试</h1>
    <button onclick="startDetection()">开始检测</button>
    <br><br>
    <img id="videoStream" alt="检测结果" style="max-width: 800px; border: 1px solid #ccc;" />

    <script>
        function startDetection() {
            // 写死的参数
            const model = "app/checkpoints/v8.pt";  // 模型路径
            const video = "app/videos/test.mp4";    // 视频路径
            
            // 后端服务地址
            const baseUrl = "http://localhost:8000";
            
            // 构造请求URL
            const url = `${baseUrl}/detect/infer?model=${encodeURIComponent(model)}&video=${encodeURIComponent(video)}`;
            
            // 设置图片源为MJPEG流
            document.getElementById("videoStream").src = url;
        }
    </script>
</body>
</html>
