services:
  db:
    image: pgvector/pgvector:pg16
    container_name: postgres_db
    restart: always
    # Load credentials from the .env file
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready --username=$$POSTGRES_USER && psql --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB --command='SELECT 1' > /dev/null 2>&1 || (psql --username=$$POSTGRES_USER --command=\"CREATE DATABASE $$POSTGRES_DB\" && psql --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB --command='SELECT 1')",
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    env_file:
      - ./.env
    # 5432 端口不对外暴露！后端通过 Docker 内网（服务名 'db'）连接
    # 如需本地调试，临时取消注释下面两行，调试完立即注释回来
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:alpine
    container_name: redis_cache
    restart: always
    # 6379 端口不对外暴露！后端通过 Docker 内网连接
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
   build: ./backend
   container_name: backend_app
   restart: always
   # Remove external port mapping since Caddy will handle it
   ports:
     - "8000:8000"
   # Load all necessary environment variables from the .env file
   env_file:
     - ./.env
   # Override or set specific variables needed for the container environment
   environment:
     - DB_HOST=db # The backend connects to the db service on the Docker network
     - DB_USER=${POSTGRES_USER}
     - DB_PASSWORD=${POSTGRES_PASSWORD}
     - DB_NAME=${POSTGRES_DB}

   depends_on:
     db:
       condition: service_healthy # Ensure the db service is healthy before starting the backend
     redis:
       condition: service_healthy

  frontend:
   build:
     context: ./frontend
     args:
       # NEXT_PUBLIC_BACKEND_URL：浏览器直接访问后端（外网地址），从 .env 中读取
       NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
       # BACKEND_URL：Next.js 服务端 rewrites 代理到后端（Docker 内网地址，固定不变）
       BACKEND_URL: http://backend:8000
   restart: always
   ports:
     - "3000:3000"
   # 限制内存上限，防止 Next.js 内存泄漏导致 OOM 崩溃
   mem_limit: 800m
   memswap_limit: 1200m
   depends_on:
     - backend

volumes:
  postgres_data:
  redis_data:
